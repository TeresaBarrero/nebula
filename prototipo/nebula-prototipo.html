<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>nebúla CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Outfit:wght@300;400;500;600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar salvia plegable + área de trabajo con barra superior fija; módulos en tarjetas pastel por significado (estado, prioridad, cuadrante). */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --surface-2:#f8f9f6; --line:#e2e7df; --fg:#283029; --muted:#667068; --faint:#98a199;
  --sage:#d3dfcd; --sage-strong:#5b7a57; --sage-ink:#2f4a2d;
  --peach:#fbdccd; --peach-ink:#8a4630; --peach-strong:#ec9473;
  --butter:#fcefc3; --butter-ink:#76590f;
  --sand:#f1e4d0; --sand-ink:#6b5230;
  --lilac:#dfdbf0; --lilac-ink:#4a4380;
  --mist:#e8eae7; --mist-ink:#545b55;
  --rose:#f8d3cf; --rose-ink:#9a3527;
  --danger:#c24e3c; --ok:#4c8754;
  --overlay:rgba(30,38,32,.38);
  --shadow:0 1px 2px rgba(40,52,40,.05),0 10px 30px rgba(40,52,40,.07);
  --f-logo:"Caveat","Segoe Script",cursive;
  --f-head:"Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151916; --surface:#1d231f; --surface-2:#222924; --line:#2e3731; --fg:#e6ebe5; --muted:#a2aca3; --faint:#6f7a71;
  --sage:#2a382a; --sage-strong:#9cc196; --sage-ink:#d2e6cc;
  --peach:#42302a; --peach-ink:#f3c3ad; --peach-strong:#e8977a;
  --butter:#3b3420; --butter-ink:#ecd890;
  --sand:#383026; --sand-ink:#e6d0af;
  --lilac:#2e2b44; --lilac-ink:#cbc4f1;
  --mist:#29302b; --mist-ink:#c4cbc5;
  --rose:#452825; --rose-ink:#f3b0a5;
  --danger:#ea8571; --ok:#8cc792;
  --overlay:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151916; --surface:#1d231f; --surface-2:#222924; --line:#2e3731; --fg:#e6ebe5; --muted:#a2aca3; --faint:#6f7a71;
  --sage:#2a382a; --sage-strong:#9cc196; --sage-ink:#d2e6cc;
  --peach:#42302a; --peach-ink:#f3c3ad; --peach-strong:#e8977a;
  --butter:#3b3420; --butter-ink:#ecd890;
  --sand:#383026; --sand-ink:#e6d0af;
  --lilac:#2e2b44; --lilac-ink:#cbc4f1;
  --mist:#29302b; --mist-ink:#c4cbc5;
  --rose:#452825; --rose-ink:#f3b0a5;
  --danger:#ea8571; --ok:#8cc792;
  --overlay:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--sage-strong);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-head);font-weight:500;margin:0;text-wrap:balance}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:auto 1fr;height:100%}
.side{width:248px;background:var(--sage);color:var(--sage-ink);display:flex;flex-direction:column;padding:20px 14px;padding-left:calc(14px + env(safe-area-inset-left,0px));gap:6px;transition:width .25s ease;overflow:hidden;z-index:30}
.side .brand{display:flex;align-items:center;justify-content:space-between;padding:0 8px 14px;min-height:52px}
.logo{font-family:var(--f-logo);font-size:38px;font-weight:700;line-height:1;letter-spacing:.5px;color:var(--sage-ink);white-space:nowrap}
.logo small{font-size:22px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--sage-ink);text-decoration:none;font-weight:600;font-size:13.5px;white-space:nowrap;position:relative;transition:background .15s}
.nav a:hover{background:color-mix(in srgb,var(--surface) 45%,transparent)}
.nav a.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.nav a .badge{margin-left:auto}
.nav-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.65;padding:16px 12px 6px;font-weight:700;white-space:nowrap}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;text-decoration:none;color:inherit}
.me:hover{background:color-mix(in srgb,var(--surface) 45%,transparent)}
.me b{display:block;font-size:13px}.me span{font-size:11.5px;opacity:.75}
.collapse-btn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;font-weight:600;font-size:12.5px;opacity:.8;white-space:nowrap}
.collapse-btn:hover{opacity:1;background:color-mix(in srgb,var(--surface) 45%,transparent)}
.app.compact .side{width:78px}
.app.compact .side .lbl,.app.compact .nav-label,.app.compact .me div,.app.compact .nav a .badge{display:none}
.app.compact .logo{font-size:30px}
.app.compact .logo .full{display:none}
.logo .short{display:none}.app.compact .logo .short{display:inline}
.collapse-top{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--sage-ink);opacity:.7;flex:none;transition:opacity .15s,background .15s}
.collapse-top:hover{opacity:1;background:color-mix(in srgb,var(--surface) 55%,transparent)}
.collapse-top svg{transition:transform .25s ease}
.app.compact .collapse-top svg{transform:rotate(180deg)}
@media (min-width:861px){
  .app.compact .side{padding-left:calc(10px + env(safe-area-inset-left,0px));padding-right:10px;align-items:center}
  .app.compact .side .brand{flex-direction:column;gap:12px;padding:0 0 14px;justify-content:center}
  .app.compact .nav{align-items:center;width:100%}
  .app.compact .nav a{width:44px;height:44px;padding:0;justify-content:center;gap:0}
  .app.compact .nav-label{display:block;width:28px;height:1px;padding:0;margin:8px auto;background:color-mix(in srgb,var(--sage-ink) 22%,transparent);font-size:0;overflow:hidden}
  .app.compact .nav a .badge{display:block;position:absolute;top:7px;right:7px;min-width:8px;width:8px;height:8px;padding:0;font-size:0;background:var(--peach-strong);border-radius:50%}
  .app.compact .side-foot{align-items:center;width:100%}
  .app.compact .me{padding:4px;justify-content:center}
}

.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px 32px;border-bottom:1px solid var(--line);background:var(--bg)}
.search-trigger{flex:1;min-width:0;max-width:520px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--faint);text-align:left;transition:border-color .15s}
.search-trigger:hover{border-color:var(--sage-strong)}
.search-trigger span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font-family:var(--f-body);font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.spacer{flex:1}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--muted);position:relative;flex:none}
.icon-btn:hover{background:var(--surface);color:var(--fg)}
.dot-count{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--peach-strong);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;line-height:1}
.menu-btn{display:none}
.content{flex:1;overflow:auto;padding-block:28px 120px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.page{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* ---------- Page header ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--sage-strong)}
.ph h1{font-size:30px;letter-spacing:-.01em;margin-top:2px}
.ph p{margin:4px 0 0;color:var(--muted)}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- Atoms ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:11px;font-weight:600;font-size:13.5px;border:1px solid var(--line);background:var(--surface);white-space:nowrap;transition:transform .1s,background .15s,border-color .15s}
.btn:hover{border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--peach-strong);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.04)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface);color:var(--fg)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn.danger{color:var(--danger)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;line-height:1.5}
.peach{background:var(--peach);color:var(--peach-ink)}
.butter{background:var(--butter);color:var(--butter-ink)}
.sand{background:var(--sand);color:var(--sand-ink)}
.lilac{background:var(--lilac);color:var(--lilac-ink)}
.mist{background:var(--mist);color:var(--mist-ink)}
.sage{background:var(--sage);color:var(--sage-ink)}
.rose{background:var(--rose);color:var(--rose-ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}
.chip svg.i{width:14px;height:14px}
.chip.late{color:var(--danger);font-weight:600}
.chip.link{cursor:pointer}.chip.link:hover{color:var(--fg)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;font-size:11px;font-weight:700;display:inline-grid;place-items:center;background:var(--surface);color:var(--fg)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;font-family:var(--f-head)}
.avatar.lg{width:72px;height:72px;font-size:24px}
.avatar.xl{width:104px;height:104px;font-size:34px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card h2,.sec-h{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h a,.text-link{font-size:12.5px;font-weight:600;color:var(--sage-strong);cursor:pointer;text-decoration:none}
.muted{color:var(--muted)}
.empty{padding:22px 10px;text-align:center;color:var(--faint);font-size:13px}
.grid{display:grid;gap:18px}
.grid>*{min-width:0}
.g-home{grid-template-columns:1.35fr 1fr}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.progress{height:6px;border-radius:6px;background:var(--mist);overflow:hidden}
.progress i{display:block;height:100%;border-radius:6px;background:var(--sage-strong);transition:width .4s ease}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{padding:6px 12px;border-radius:9px;font-weight:600;font-size:12.5px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.seg button.on{background:var(--sage);color:var(--sage-ink)}
.seg button .n{font-size:11px;opacity:.7}
.input{width:100%;padding:10px 13px;border-radius:11px;border:1px solid var(--line);background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--sage-strong);box-shadow:0 0 0 3px color-mix(in srgb,var(--sage-strong) 18%,transparent)}
.search-box{position:relative}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search-box .input{padding-left:38px}

/* ---------- Stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:2px;text-align:left;transition:transform .15s}
button.stat:hover{transform:translateY(-2px)}
.stat .k{font-size:12px;font-weight:600;opacity:.85}
.stat .v{font-family:var(--f-head);font-size:28px;font-weight:500;line-height:1.2}
.stat .s{font-size:12px;opacity:.75}

/* ---------- Home ---------- */
.hello h1{font-size:34px}
.quick{display:flex;flex-direction:column;gap:10px}
.quick-row{display:flex;gap:10px}
.quick-row .input{font-size:15px;padding:12px 14px}
.quick-hint{font-size:12px;color:var(--faint);display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:24px}
.quick-hint code{font-family:inherit;font-weight:700;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:0 5px;border-radius:5px}
.list{display:flex;flex-direction:column}
.task{display:flex;align-items:flex-start;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.check{width:20px;height:20px;border-radius:7px;border:1.6px solid var(--faint);flex:none;margin-top:1px;display:grid;place-items:center;transition:all .15s;background:var(--surface)}
.check:hover{border-color:var(--sage-strong)}
.check.on{background:var(--sage-strong);border-color:var(--sage-strong);color:var(--surface)}
.check svg{width:13px;height:13px;stroke-width:2.6}
.task-body{flex:1;min-width:0}
.task-t{font-weight:600;cursor:pointer;display:block;text-align:left;width:100%}
.task.done .task-t{text-decoration:line-through;color:var(--faint);font-weight:500}
.task-m{display:flex;gap:12px;flex-wrap:wrap;margin-top:3px}
.qdot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px}
.ev{display:flex;gap:14px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.ev:last-child{border-bottom:0}
.ev-date{width:48px;text-align:center;border-radius:12px;padding:6px 0;flex:none;line-height:1.1}
.ev-date b{display:block;font-family:var(--f-head);font-size:19px;font-weight:500}
.ev-date span{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.ev b.t{display:block;font-weight:600}
.proj-mini{display:flex;flex-direction:column;gap:6px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.proj-mini:last-child{border-bottom:0}
.proj-mini .row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.follow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.follow:last-child{border-bottom:0}

/* ---------- Contacts ---------- */
.two{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
.c-list{padding:14px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0}
.c-items{display:flex;flex-direction:column;gap:2px;max-height:62vh;overflow:auto;margin:0 -6px;padding:0 6px}
.c-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;text-align:left;width:100%}
.c-item:hover{background:var(--surface-2)}
.c-item.on{background:var(--sage)}
.c-item .nm{font-weight:600;display:block}
.c-item .co{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-item>div{min-width:0;flex:1}
.sdot{width:9px;height:9px;border-radius:50%;flex:none}
.c-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.c-head h2{font-size:24px;font-weight:500}
.c-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.info dt{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:700}
.info dd{margin:2px 0 0;overflow-wrap:anywhere}
.info .full{grid-column:1/-1}
.timeline{display:flex;flex-direction:column;position:relative;margin-top:6px}
.tl{display:flex;gap:14px;position:relative;padding-bottom:16px}
.tl:not(:last-child)::before{content:"";position:absolute;left:15px;top:34px;bottom:2px;width:1.5px;background:var(--line)}
.tl-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.tl-ic svg{width:16px;height:16px}
.tl-b{flex:1;min-width:0;padding-top:4px}
.tl-b b{font-weight:600}
.tl-b p{margin:2px 0 0;color:var(--muted)}
.tl-d{font-size:11.5px;color:var(--faint);white-space:nowrap;padding-top:6px}
.log{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.log select{width:auto}
.log .input{flex:1;min-width:160px}

/* ---------- Projects ---------- */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.toolbar .search-box{flex:1;max-width:340px;min-width:200px}
.p-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.p-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;transition:transform .15s,box-shadow .15s;cursor:pointer;text-align:left}
.p-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.p-card h3{font-size:17px;font-weight:500;line-height:1.3}
.p-card .client{font-size:12.5px;color:var(--muted);margin-top:2px}
.p-top{display:flex;gap:6px;flex-wrap:wrap}
.p-meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.p-prog{display:flex;flex-direction:column;gap:6px}
.p-prog .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.p-foot{display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px dashed var(--line)}
.p-foot b{font-family:var(--f-head);font-weight:500;font-size:16px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}

/* ---------- Tasks ---------- */
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.quad{border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px;min-height:220px;transition:outline-color .15s;outline:2px dashed transparent;outline-offset:-6px}
.quad.over{outline-color:currentColor}
.quad-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.quad-h h2{font-size:16px;font-weight:600}
.quad-h span{font-size:12px;font-weight:600;opacity:.8}
.quad .task{border-bottom-color:color-mix(in srgb,currentColor 14%,transparent);padding:9px 2px}
.quad .task-t{color:var(--fg)}
.quad .chip{color:color-mix(in srgb,currentColor 75%,var(--fg))}
.quad .check{background:color-mix(in srgb,var(--surface) 70%,transparent);border-color:color-mix(in srgb,currentColor 45%,transparent)}
.quad-add{margin-top:auto;padding-top:8px}
.quad-add input{width:100%;background:color-mix(in srgb,var(--surface) 55%,transparent);border:1px solid transparent;border-radius:10px;padding:8px 12px;outline:none;color:var(--fg)}
.quad-add input::placeholder{color:color-mix(in srgb,currentColor 65%,transparent)}
.quad-add input:focus{background:var(--surface);border-color:currentColor}
[draggable="true"]{cursor:grab}
.done-box{border-radius:20px;padding:6px 18px}
.done-box summary{cursor:pointer;padding:12px 0;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
.done-box summary::-webkit-details-marker{display:none}
.done-box[open] summary svg{transform:rotate(90deg)}
.done-box summary svg{transition:transform .2s}

/* ---------- Calendar ---------- */
.cal-wrap{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
.cal{padding:0;overflow:hidden}
.cal-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cal-head h2{font-size:18px;font-weight:500;flex:1}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dow{padding:10px 8px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:center;border-bottom:1px solid var(--line)}
.cal-cell{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;transition:background .12s;min-width:0}
.cal-cell:nth-child(7n){border-right:0}
.cal-cell:hover{background:var(--surface-2)}
.cal-cell.out{background:var(--surface-2)}
.cal-cell.out .dn{color:var(--faint)}
.cal-cell.sel{box-shadow:inset 0 0 0 2px var(--sage-strong)}
.dn{font-size:12.5px;font-weight:700;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.cal-cell.today .dn{background:var(--peach-strong);color:#fff}
.cal-chip{font-size:11px;font-weight:600;padding:2px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cal-more{font-size:11px;color:var(--muted);padding-left:4px}
.page>.seg{align-self:flex-start}

/* ---------- Invoices ---------- */
.table-wrap{overflow-x:auto;margin:0 -20px -20px;padding:0}
table{width:100%;border-collapse:collapse;min-width:720px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:700;text-align:left;padding:10px 20px;border-bottom:1px solid var(--line)}
td{padding:13px 20px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:var(--surface-2)}
td.amt,th.amt{text-align:right;font-variant-numeric:tabular-nums}
td.amt{font-weight:700;white-space:nowrap}
td:first-child{white-space:nowrap}

/* ---------- Notes ---------- */
.notes{columns:4 240px;column-gap:16px}
.note{break-inside:avoid;margin-bottom:16px;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.note p{margin:0;white-space:pre-wrap;color:var(--fg);font-size:14.5px;line-height:1.55}
.note-f{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.note-f .chips{display:flex;gap:8px;flex-wrap:wrap}
.note-act{display:flex;gap:2px;opacity:.55;transition:opacity .15s}
.note:hover .note-act,.note:focus-within .note-act{opacity:1}
.note-act button{width:28px;height:28px;display:grid;place-items:center;border-radius:8px}
.note-act button:hover{background:color-mix(in srgb,var(--surface) 60%,transparent)}
.note-act svg{width:15px;height:15px}
.note.pinned::after{content:"";position:absolute;top:10px;right:12px;width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.6}
.note-new{display:flex;flex-direction:column;gap:10px}
.note-new textarea{min-height:70px;resize:vertical}
.swatches{display:flex;gap:6px}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid transparent}
.sw.on{border-color:var(--fg)}

/* ---------- Reports ---------- */
.g-rep{grid-template-columns:1.6fr 1fr}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hbar{display:flex;flex-direction:column;gap:12px}
.hbar .row{display:grid;grid-template-columns:150px 1fr 40px;gap:12px;align-items:center;font-size:13px}
.hbar .track{height:10px;border-radius:6px;background:var(--mist);overflow:hidden}
.hbar .track i{display:block;height:100%;border-radius:6px}
.rank{display:flex;flex-direction:column}
.rank .r{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.rank .r:last-child{border-bottom:0}
.rank .r>b{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.rank .r div b{display:block}

/* ---------- Profile ---------- */
.g-prof{grid-template-columns:360px 1fr}
.prof-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:32px 24px;background:var(--peach);border:0;color:var(--peach-ink)}
.prof-card h2{font-size:22px;color:var(--fg);margin-top:10px}
.prof-rows{width:100%;display:flex;flex-direction:column;gap:8px;margin-top:16px}
.prof-rows div{background:var(--surface);color:var(--fg);border-radius:11px;padding:9px 12px;font-size:13px;overflow-wrap:anywhere}
.pref{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pref:last-child{border-bottom:0}
.pref b{display:block;font-weight:600}
.pref span{font-size:12.5px;color:var(--muted)}
.switch{width:44px;height:26px;border-radius:13px;background:var(--mist);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch.on{background:var(--sage-strong)}
.switch.on::after{transform:translateX(18px)}

/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 16px;animation:fade .15s ease;backdrop-filter:blur(2px)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.modal{background:var(--surface);border-radius:22px;width:100%;max-width:620px;max-height:84vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.25);animation:pop .2s ease;overflow:hidden}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:18px}
.modal-b{padding:20px 22px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.modal-f .left{margin-right:auto}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12px;font-weight:700;color:var(--muted)}
.field.full,.f-section{grid-column:1/-1}
.f-section{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--peach-ink);background:var(--peach);padding:7px 12px;border-radius:9px;margin-top:6px}
.f-section:first-child{margin-top:0}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills label{cursor:pointer}
.pills input{position:absolute;opacity:0;pointer-events:none}
.pills .pill{padding:6px 12px;border:2px solid transparent;font-size:12.5px}
.pills input:checked+.pill{border-color:currentColor}
.pills input:focus-visible+.pill{outline:2px solid var(--sage-strong);outline-offset:2px}
.toggle{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;border:1px solid var(--line);cursor:pointer;font-weight:600}
.toggle input{accent-color:var(--sage-strong);width:17px;height:17px}

.palette{max-width:600px}
.pal-in{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.pal-in input{flex:1;border:0;outline:none;background:none;font-size:16px}
.pal-list{overflow:auto;max-height:52vh;padding:8px}
.pal-group{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:10px 12px 4px}
.pal-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;width:100%;text-align:left}
.pal-item .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.pal-item .ic svg{width:16px;height:16px}
.pal-item small{color:var(--muted);margin-left:auto;font-size:12px;white-space:nowrap}
.pal-item.on{background:var(--sage);color:var(--sage-ink)}
.pal-item.on small{color:inherit}
.pal-foot{display:flex;gap:16px;padding:10px 20px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);flex-wrap:wrap}

.drawer-ov{align-items:stretch;justify-content:flex-end;padding:0}
.drawer{background:var(--bg);width:100%;max-width:560px;height:100%;overflow:auto;animation:slide .25s ease;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.drawer-h{padding:20px 24px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.drawer-h h2{font-size:22px;line-height:1.25}
.drawer-b{padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kv dt{font-size:11px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.kv dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.inline-add{display:flex;gap:8px;margin-top:8px}

.notif{position:fixed;top:64px;right:max(16px,env(safe-area-inset-right,0px));width:380px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.18);z-index:45;animation:pop .18s ease;overflow:hidden}
.notif-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.notif-l{max-height:60vh;overflow:auto}
.notif-i{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);width:100%;text-align:left;align-items:flex-start}
.notif-i:hover{background:var(--surface-2)}
.notif-i:last-child{border-bottom:0}
.notif-i .tl-ic{width:30px;height:30px}
.notif-i p{margin:0;font-size:13px}
.notif-i small{color:var(--faint);font-size:11.5px}
.notif-i.unread p{font-weight:600}
.notif-i.unread::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--peach-strong);flex:none;margin-top:6px;margin-left:auto}

.fab{position:fixed;right:calc(28px + env(safe-area-inset-right,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab-btn{width:58px;height:58px;border-radius:20px;background:var(--peach-strong);color:#fff;display:grid;place-items:center;box-shadow:0 12px 30px color-mix(in srgb,var(--peach-strong) 45%,transparent);transition:transform .2s}
.fab-btn svg{width:26px;height:26px;stroke-width:2.2;transition:transform .2s}
.fab.open .fab-btn svg{transform:rotate(45deg)}
.fab-menu{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.fab-menu button{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:600;animation:pop .15s ease both}
.fab-menu button .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center}
.fab-menu button .ic svg{width:15px;height:15px}

.toasts{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:pop .2s ease;display:flex;gap:12px;align-items:center;pointer-events:auto}
.toast button{color:var(--peach-strong);font-weight:700}
.scrim{display:none}

/* ---------- Ventas (kanban) ---------- */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px}
.kcol{border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:340px;outline:2px dashed transparent;outline-offset:-5px;transition:outline-color .15s}
.kcol.over{outline-color:currentColor}
.kcol-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 4px 4px}
.kcol-h b{font-size:13.5px}
.kcol-h span{font-size:12px;font-weight:700;opacity:.8}
.deal{background:var(--surface);color:var(--fg);border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 2px rgba(0,0,0,.05);text-align:left;width:100%;border:1px solid transparent;transition:border-color .15s}
.deal:hover{border-color:var(--line)}
.deal b{font-weight:600;line-height:1.35}
.deal .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.deal .val{font-family:var(--f-head);font-size:16px;font-weight:500}
.prob{height:4px;border-radius:4px;background:var(--mist);overflow:hidden}
.prob i{display:block;height:100%;background:var(--sage-strong)}
.kcol .empty{color:inherit;opacity:.65}

/* ---------- Facturas: editor y documento ---------- */
.modal.wide{max-width:860px}
.modal-b.block{display:flex;flex-direction:column;gap:16px}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 16px}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 80px 110px 100px 36px;gap:8px;align-items:center}
.line .sub{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.line-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.totals{margin-left:auto;width:100%;max-width:320px;display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between;gap:12px}
.totals .grand{border-top:1px solid var(--line);padding-top:8px;font-size:17px;font-weight:700;font-family:var(--f-head)}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:22px;font-size:13px}
.paper-h{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.paper-h h3{font-size:22px;letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.paper .who{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.paper .who dt{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:4px}
.paper .who dd{margin:0;line-height:1.6}
.paper table{min-width:0}
.paper th,.paper td{padding:8px 6px}
.paper tbody tr{cursor:default}
.paper tbody tr:hover{background:none}
.vf{display:flex;gap:14px;align-items:center;border:1.5px dashed var(--line);border-radius:12px;padding:12px;color:var(--muted);font-size:12px}
.vf .qr{width:64px;height:64px;border-radius:8px;flex:none;background:repeating-linear-gradient(45deg,var(--mist) 0 6px,var(--surface-2) 6px 12px);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--faint)}
.pay{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.pay:last-child{border-bottom:0}
.drawer.wide{max-width:720px}

/* ---------- Documentos ---------- */
.files{display:flex;flex-direction:column}
.file{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line)}
.file:last-child{border-bottom:0}
.file .fi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:.04em;flex:none;overflow:hidden}
.file .fi img{width:100%;height:100%;object-fit:cover}
.file .fn{flex:1;min-width:0}
.file .fn b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upload{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--sage-strong);cursor:pointer}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.upload:focus-within{outline:2px solid var(--sage-strong);outline-offset:2px;border-radius:6px}
.drop-hint{border:1.5px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--faint);font-size:12.5px;margin-top:8px}

/* ---------- RGPD y varios ---------- */
.rgpd{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.rgpd .state{flex:1;min-width:220px;border-radius:12px;padding:12px 14px}
.rgpd .state b{display:block}
.rgpd .acts{display:flex;gap:8px;flex-wrap:wrap}
.json{width:100%;min-height:280px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.5;resize:vertical}
.warn{border-radius:12px;padding:12px 14px;font-size:13px}
.avatar.sq{border-radius:11px}
.fiscal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fiscal div{border-radius:12px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line)}
.fiscal span{display:block;font-size:12px;color:var(--muted)}
.fiscal b{font-family:var(--f-head);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.fiscal .hl{background:var(--peach);border-color:transparent;color:var(--peach-ink)}
.fiscal .hl span{color:inherit}
.foot-note{font-size:12px;color:var(--faint);margin-top:12px}

/* ---------- v3: perfil creativo ---------- */
.nav a{padding:8px 12px}
.nav-label{padding:12px 12px 4px}
.side{overflow-y:auto}
.help{position:relative;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-size:10.5px;font-weight:800;cursor:help;vertical-align:1px;margin-left:2px;text-transform:none;letter-spacing:0;font-family:var(--f-body);line-height:1;flex:none}
.help .tip{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:max-content;max-width:260px;background:var(--fg);color:var(--bg);font-size:12px;font-weight:500;line-height:1.45;padding:9px 11px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .15s;z-index:70;text-align:left;white-space:normal}
.help:hover .tip,.help:focus .tip{display:block;opacity:1}
.help:focus{outline:2px solid var(--sage-strong);outline-offset:1px}
.timer{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;font-weight:700;font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap;max-width:320px}
.timer:hover{color:var(--fg);border-color:var(--faint)}
.timer.on{background:var(--peach);color:var(--peach-ink);border-color:transparent}
.timer .rec{width:8px;height:8px;border-radius:50%;background:var(--danger);animation:blink 1.4s infinite;flex:none}
.timer .tlab{overflow:hidden;text-overflow:ellipsis;font-weight:600}
@keyframes blink{50%{opacity:.25}}
.task .play{width:30px;height:30px;opacity:.35;margin-top:-4px}
.task:hover .play,.task .play:focus-visible{opacity:1}
.task .play svg{width:14px;height:14px}
.stepper{display:flex;gap:4px}
.stepper span{flex:1;height:5px;border-radius:3px;background:var(--mist)}
.stepper span.on{background:var(--sage-strong)}
.phases{display:flex;gap:4px;flex-wrap:wrap}
.phases button{flex:1 1 90px;padding:8px 6px;border-radius:10px;font-size:11.5px;font-weight:700;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.phases button.done{background:var(--sage);color:var(--sage-ink);border-color:transparent}
.phases button.cur{background:var(--sage-strong);color:var(--surface);border-color:transparent}
.sec-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--faint);margin:12px 0 6px}
.dlv{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.dlv-h{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.dlv-m{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.vers summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--sage-strong)}
.ver{display:flex;gap:10px;align-items:baseline;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line)}
.ver:last-child{border-bottom:0}
.ver span:nth-child(2){flex:1}
.ver .sdot{width:7px;height:7px;position:relative;top:-1px}
.r-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.r-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}

 S.deliverables.filter(d=>filter(d)).forEach(d=>{d.versions.forEach(v=>items.push({date:v.date,icon:'send',cls:'butter',title:`Entregable enviado · v${v.v}`,text:d.name}));d.feedback.forEach((f,k)=>items.push({date:f.date,icon:'talk',cls:'peach',title:`El cliente pide cambios · ronda ${k+1}`,text:`${d.name}: ${f.text}`}));if(d.approved)items.push({date:d.approved,icon:'tick',cls:'sage',title:'Entregable aprobado',text:d.name})});
 items.sort((a,b)=>b.date.localeCompare(a.date));
 if(!items.length)return `<div class="empty">Todavía no hay actividad. Registra una llamada o una nota para empezar el historial.</div>`;

function filesBox(filter,link){

function monthGrid(cal,sel,itemsOn,act){
 const {y,m}=cal;const first=new Date(y,m,1);const off=(first.getDay()+6)%7;const start=new Date(y,m,1-off);
 const cells=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);cells.push(d)}
 const rows=cells.slice(35).every(d=>d.getMonth()!==m)?35:42;const T=TODAY();
 return `<div class="cal-grid">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
  ${cells.slice(0,rows).map(d=>{const s=iso(d);const it=itemsOn(s);
   return `<button class="cal-cell ${d.getMonth()!==m?'out':''} ${s===T?'today':''} ${s===sel?'sel':''}" data-act="${act}" data-date="${s}" aria-label="${fmtD(s)}, ${it.length} elementos"><span class="dn">${d.getDate()}</span>${it.slice(0,3).map(i=>`<span class="cal-chip ${i.cls}">${esc(i.t)}</span>`).join('')}${it.length>3?`<span class="cal-more">+${it.length-3} más</span>`:''}</button>`}).join('')}</div>`;
}

VIEWS.proyectos=()=>{
 const groups={activos:p=>isActiveP(p),pausa:p=>p.status==='pausa',entregado:p=>p.status==='entregado',all:()=>true};
 let list=S.projects.filter(groups[ui.pStatus]);
 if(ui.pDisc!=='all')list=list.filter(p=>p.discipline===ui.pDisc);
 const order={urgente:0,alta:1,media:2,baja:3};
 list.sort((a,b)=>order[a.priority]-order[b.priority]);
 return `
 <div class="ph"><div><div class="eyebrow">Trabajo</div><h1>Proyectos</h1><p>Cada proyecto avanza por fases: briefing, investigación, concepto, diseño y desarrollo, revisiones y entrega.</p></div>

 <div class="toolbar">

 </div>
 <div class="p-grid">${list.map(p=>{const g=progressOf(p.id);const c=C(p.contactId);const late=isActiveP(p)&&dd(p.end)<0;const m=projectMoney(p.id);const over=p.hoursBudget&&m.min/60>p.hoursBudget;
  const waiting=S.deliverables.filter(d=>d.projectId===p.id&&d.status==='enviado').length;
  return `<button class="p-card" data-act="open-project" data-id="${p.id}">
   <div class="p-top">${discPill(p.discipline)}${pill(PH[p.status])}${p.priority==='urgente'?pill(PRI.urgente):''}</div>
   <div><h3>${esc(p.name)}</h3><div class="client">${c?esc(c.name)+' · '+esc(coName(c)):'Sin cliente'}</div></div>

   <div class="p-meta"><span class="chip">${ic('calendar')}${fmtShort(p.start)} → ${fmtShort(p.end)}</span><span class="chip ${late?'late':''}">${late?'Retrasado':p.status==='entregado'?'Entregado':'Entrega '+relD(p.end)}</span></div>
   <div class="p-foot"><div><b class="num">${eur(p.budget)}</b><div class="chip num">${m.min&&m.inc?`${eur(m.eurh)}/h reales`:'Sin facturar aún'}</div></div><span class="text-link">Abrir →</span></div>
  </button>`}).join('')||`<div class="card empty">No hay proyectos aquí.</div>`}</div>`;
};

VIEWS.horas=()=>{
 const T=today0();const mon=new Date(T);mon.setDate(T.getDate()-((T.getDay()+6)%7));
 const days=[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);const s=iso(d);return{s,min:minutes(t=>t.date===s),lab:['L','M','X','J','V','S','D'][i]}});
 const wk=days.reduce((a,d)=>a+d.min,0);const wkBill=minutes(t=>t.billable&&days.some(d=>d.s===t.date));
 const maxD=Math.max(...days.map(d=>d.min),240);
 const since=addDays(-180);
 const incTot=issued().filter(i=>i.date>=since&&(i.projectId||i.retainerId)).reduce((a,i)=>a+tot(i).base,0);
 const minTot=minutes(t=>t.date>=since&&t.billable);
 const recent=S.time.filter(t=>dd(t.date)>=-13).sort((a,b)=>b.date.localeCompare(a.date));
 const byDay={};recent.forEach(t=>(byDay[t.date]=byDay[t.date]||[]).push(t));
 const projs=S.projects.filter(p=>isActiveP(p)||minutes(t=>t.projectId===p.id&&dd(t.date)>-30)).map(p=>({p,m:projectMoney(p.id)}));
 return `
 <div class="ph"><div><div class="eyebrow">Trabajo</div><h1>Horas</h1><p>Usa el cronómetro de arriba o apunta las horas a mano. Así sabrás cuánto ganas de verdad por hora en cada proyecto.</p></div>
  <div class="ph-actions"><button class="btn" data-act="new" data-kind="time">${ic('plus')}Apuntar horas</button><button class="btn primary" data-act="timer-start">${ic('play')}Iniciar cronómetro</button></div></div>
 <div class="stats">
  <div class="stat peach"><span class="k">Esta semana</span><span class="v num">${hrs(wk)}</span><span class="s">${hrs(wkBill)} para clientes</span></div>
  <div class="stat sage"><span class="k">Precio por hora real ${help('eurh')}</span><span class="v num">${eur(minTot?incTot/(minTot/60):0)}</span><span class="s">Últimos 6 meses · tu tarifa: ${eur(S.profile.rate)}/h</span></div>
  <div class="stat lilac"><span class="k">Horas de igualas este mes</span><span class="v num">${hrs(S.retainers.reduce((a,r)=>a+retMin(r),0))}</span><span class="s">de ${S.retainers.filter(r=>r.active).reduce((a,r)=>a+r.hours,0)} h incluidas</span></div>
  <div class="stat butter"><span class="k">Trabajo interno · 30 días</span><span class="v num">${hrs(minutes(t=>!t.billable&&dd(t.date)>-30))}</span><span class="s">Administración, ventas, formación</span></div>
 </div>
 <div class="grid g-rep">
  <section class="card"><div class="card-h"><h2>Esta semana</h2><span class="chip num">${hrs(wk)}</span></div>
   <div class="week">${days.map(d=>`<div class="col ${d.s===TODAY()?'today':''}"><span class="chip num">${d.min?hrs(d.min):''}</span><div class="bar" style="height:${Math.max(2,d.min/maxD*100)}%"></div><b>${d.lab}</b></div>`).join('')}</div></section>
  <section class="card"><div class="card-h"><h2>Horas por proyecto</h2></div>
   <div class="hbar">${projs.map(({p,m})=>{const pct=p.hoursBudget?m.min/60/p.hoursBudget*100:0;return `<div class="row" style="grid-template-columns:minmax(0,1fr) 90px;cursor:pointer" data-act="open-project" data-id="${p.id}"><div><div style="display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:4px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span><span class="num muted">${hrs(m.min)}/${p.hoursBudget||'—'} h</span></div><div class="track"><i style="width:${Math.min(100,pct)}%;background:${pct>100?'var(--danger)':'var(--sage-strong)'}"></i></div></div><b class="num" style="text-align:right">${m.inc&&m.min?eur(m.eurh)+'/h':'—'}</b></div>`}).join('')}</div>
   <p class="foot-note">A la derecha, lo que estás ganando por hora en cada proyecto con lo facturado hasta ahora.</p></section>
 </div>
 <section class="card"><div class="card-h"><h2>Últimas dos semanas</h2></div>
  ${Object.entries(byDay).map(([d,ts])=>`<div class="day-h"><b>${cap(fmtD(d))}</b><span class="num">${hrs(ts.reduce((a,t)=>a+t.minutes,0))}</span></div>
   <div class="list">${ts.map(t=>`<div class="follow" data-act="edit" data-kind="time" data-id="${t.id}" style="cursor:pointer"><span class="sdot" style="background:${t.billable?'var(--sage-strong)':'var(--faint)'}" title="${t.billable?'Para cliente':'Interno'}"></span><div style="flex:1;min-width:0"><b>${esc(targetName(t))}</b><div class="chip">${esc(t.note||'')}</div></div><b class="num">${dur(t.minutes)}</b></div>`).join('')}</div>`).join('')||`<div class="empty">Aún no has apuntado horas.</div>`}
 </section>`;
};

VIEWS.informes=()=>{
 const months=[];const t=today0();
 for(let k=5;k>=0;k--){const d=new Date(t.getFullYear(),t.getMonth()-k,1);months.push({y:d.getFullYear(),m:d.getMonth(),label:new Intl.DateTimeFormat('es-ES',{month:'short'}).format(d).replace('.',''),inc:0,exp:0})}
 const mo=s=>{const d=pd(s);return months.find(x=>x.y===d.getFullYear()&&x.m===d.getMonth())};
 issued().forEach(i=>{const m=mo(i.date);if(m)m.inc+=tot(i).base});
 S.expenses.forEach(x=>{const m=mo(x.date);if(m)m.exp+=(+x.base||0)});
 const totInc=months.reduce((a,m)=>a+m.inc,0),totExp=months.reduce((a,m)=>a+m.exp,0);
 const max=Math.max(...months.map(m=>Math.max(m.inc,m.exp)),1);
 const step=max>4000?1000:max>2000?500:250;const top=Math.ceil(max/step)*step;
 const W=640,H=250,L=48,B=28,Tp=14,gw=(W-L-10)/6;const y=v=>Tp+(H-Tp-B)*(1-v/top);
 let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos por mes">`;
 for(let v=0;v<=top;v+=step){svg+=`<line x1="${L}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--faint)">${v>=1000?(v/1000)+'k':v}</text>`}
 months.forEach((m,i)=>{const x0=L+i*gw+gw*.16,w=gw*.32;
  [[m.inc,'var(--sage-strong)','ingresos',0],[m.exp,'var(--peach-strong)','gastos',w+3]].forEach(([v,col,lab,off])=>{if(v>0)svg+=`<rect x="${x0+off}" y="${y(v)}" width="${w}" height="${y(0)-y(v)}" rx="5" fill="${col}"><title>${m.label}: ${eur(v)} ${lab}</title></rect>`});
  svg+=`<text x="${x0+w+1.5}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--muted)">${m.label}</text>`;
  if(m.inc)svg+=`<text x="${x0+w/2}" y="${y(m.inc)-6}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--fg)">${(m.inc/1000).toFixed(1).replace('.',',')}k</text>`});
 svg+='</svg>';
 const Q=curQ();
 const em=issued().filter(i=>qOf(i.date)===Q);const xq=S.expenses.filter(x=>qOf(x.date)===Q&&x.deductible);
 const qi={base:0,iva:0,irpf:0};em.forEach(i=>{const t=tot(i);qi.base+=t.base;qi.iva+=t.iva;qi.irpf+=t.irpf});

function fieldHTML(f,v){
 const id='f-'+f.k,req=f.req?'required':'',full=f.full?'full':'';
 switch(f.type){
  case'section':return `<div class="f-section">${f.label}</div>`;
  case'textarea':return `<label class="field ${full}"><span>${f.label}</span><textarea class="input" id="${id}" name="${f.k}" rows="3" ${req}>${esc(v)}</textarea></label>`;
  case'select':return `<label class="field ${full}"><span>${f.label}</span><select class="input" id="${id}" name="${f.k}">${opts(f.filter?S[f.src].filter(f.filter):S[f.src],v,f.empty||'— Ninguno —')}</select></label>`;
  case'selectv':return `<label class="field ${full}"><span>${f.label}</span><select class="input" id="${id}" name="${f.k}">${f.options.map(o=>`<option value="${o}" ${String(o)===String(v??'')?'selected':''}>${f.labels&&f.labels[o]!==undefined?(f.labels[o].label??f.labels[o]):o}</option>`).join('')}</select></label>`;
  case'pills':return `<div class="field ${full}"><span>${f.label}</span><div class="pills" role="radiogroup">${f.options.map(o=>`<label><input type="radio" name="${f.k}" value="${o.v}" ${o.v===v?'checked':''}><span class="pill ${o.cls}">${o.label}</span></label>`).join('')}</div></div>`;
  case'check':return `<label class="toggle" style="grid-column:${f.full?'1/-1':'auto'}"><input type="checkbox" name="${f.k}" id="${id}" ${v?'checked':''}>${f.label}</label>`;
  case'file':return `<label class="field ${full}"><span>${f.label}${v&&v.name?` · ahora: ${esc(v.name)}`:''}</span><input class="input" type="file" id="${id}" name="${f.k}" ${f.k==='_files'?'multiple':''}></label>`;

 const e={id:uid(),date:TODAY(),minutes:min,projectId:S.timer.projectId,retainerId:S.timer.retainerId,note:S.timer.note||(S.tasks.find(x=>x.id===S.timer.taskId)?.title||''),billable:!!(S.timer.projectId||S.timer.retainerId)};
 S.time.push(e);const name=targetName(S.timer);S.timer=null;save();

function palHi(){document.querySelectorAll('.pal-item').forEach((el,i)=>{el.classList.toggle('on',i===palSel);if(i===palSel)el.scrollIntoView({block:'nearest'})})}
function palKey(e){
 if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palSel+1,palItems.length-1);palHi()}
 else if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(palSel-1,0);palHi()}
 else if(e.key==='Enter'){e.preventDefault();palItems[palSel]&&palItems[palSel].run()}
}

/* =================== Tarea rápida en lenguaje natural =================== */
const WD=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
function parseQuick(raw){
 let t=' '+raw+' ';const r={due:'',urgent:false,important:false,projectId:'',contactId:''};
 const n=norm(t);
 if(/\spasado manana\s/.test(n)){r.due=addDays(2);t=t.replace(/\spasado mañana(?=\s)/i,' ')}
 else if(/\smanana\s/.test(n)){r.due=addDays(1);t=t.replace(/\smañana(?=\s)/i,' ')}
 else if(/\shoy\s/.test(n)){r.due=addDays(0);t=t.replace(/\shoy(?=\s)/i,' ')}
 else{const m=n.match(/\s(el\s)?(lunes|martes|miercoles|jueves|viernes|sabado|domingo)\s/);
  if(m){const target=WD.indexOf(m[2]);let diff=(target-today0().getDay()+7)%7;if(diff===0)diff=7;r.due=addDays(diff);t=t.replace(new RegExp('\\s(el\\s)?'+m[2].replace('e','[eé]').replace('a','[aá]')+'(?=\\s)','i'),' ')}}
 if(/\surgente\s|!/.test(n)){r.urgent=true;t=t.replace(/\surgente(?=\s)/i,' ').replace(/!/g,'')}
 if(/\simportante\s/.test(n)){r.important=true;t=t.replace(/\simportante(?=\s)/i,' ')}
 const cm=t.match(/@([\wáéíóúñ]+)/i);if(cm){const c=S.contacts.find(c=>norm(c.name).includes(norm(cm[1])));if(c){r.contactId=c.id;t=t.replace(cm[0],c.name.split(' ')[0])}}
 const pm=t.match(/#([\wáéíóúñ]+)/i);if(pm){const p=S.projects.find(p=>norm(p.name).includes(norm(pm[1])));if(p){r.projectId=p.id;t=t.replace(pm[0],'')}}
 if(r.contactId&&!r.projectId){const p=S.projects.find(p=>p.contactId===r.contactId&&isActiveP(p));if(p)r.projectId=p.id}
 if(!r.urgent&&!r.important)r.important=true;
 r.title=t.replace(/\s+/g,' ').trim();r.title=r.title.charAt(0).toUpperCase()+r.title.slice(1);
 return r;
}
function quickPreview(){
 const v=$('#quick').value.trim();const h=$('#quickHint');
 if(!v){h.innerHTML='Atajos: <code>hoy</code> <code>mañana</code> <code>viernes</code> para la fecha · <code>urgente</code> <code>importante</code> · <code>@contacto</code> · <code>#proyecto</code>';return}
 const r=parseQuick(v);const q=QUADS[quadOf(r)];
 h.innerHTML=`Se creará: <b style="color:var(--fg)">${esc(r.title||'…')}</b> ${r.due?`<span class="pill mist">${ic('clock')}${relD(r.due)}</span>`:''}<span class="pill ${q.cls}">${q.label}</span>${r.contactId?`<span class="pill sage">${esc(C(r.contactId).name)}</span>`:''}${r.projectId?`<span class="pill butter">${esc(P(r.projectId).name)}</span>`:''}`;
}

function clauses(k){
 const p=P(k.projectId),r=R(k.retainerId),c=C(k.contactId),pr=S.profile;const L=[];
 const ipTxt={cesion:`Cuando ${pr.legalName.split(' (')[0]} haya cobrado el total, el cliente recibe los derechos de uso y explotación de los trabajos finales, sin límite de tiempo ni territorio. Los bocetos y propuestas descartadas siguen siendo de quien los creó.`,licencia:'El cliente puede usar los trabajos para su comunicación mientras dure la relación. Los derechos de autor siguen siendo de quien los creó.',colaborador:`Los derechos de explotación de todo lo creado en este encargo pasan a ${pr.legalName.split(' (')[0]} en el momento del pago, para poder cederlos a sus clientes.`}[k.ip||'cesion'];
 if(k.type==='colaborador'){
  L.push(['Objeto del encargo',k.scope||`Colaboración en proyectos de ${pr.business}.`],['Tarifa y pago',`${c?.rate?eur(c.rate)+' por hora, ':''}con factura mensual del trabajo realizado y pago en ${pr.payDays} días.`],['Plazos','Cada encargo tendrá su fecha de entrega, acordada por escrito antes de empezar.'],['Propiedad intelectual',ipTxt],['Confidencialidad','No se puede compartir información de los clientes ni de sus proyectos, ni durante ni después de la colaboración.']);
 }else if(k.type==='iguala'){
  L.push(['Servicio',r?.services||'Servicio mensual acordado.'],['Cuota',`${eur(r?.fee||0)} al mes más IVA, facturados el día ${r?.billingDay||1} de cada mes.`],['Horas incluidas',`${r?.hours||0} horas al mes. Las horas de más se cobran a ${eur(pr.rate)}/h, avisando antes.`],['Duración','Mensual, se renueva sola. Cualquiera de las partes puede terminarla avisando con 30 días.'],['Propiedad intelectual',ipTxt],['Confidencialidad','Ambas partes mantendrán en secreto la información que se compartan.']);
 }else{
  const dl=S.deliverables.filter(d=>d.projectId===k.projectId).map(d=>d.name);
  L.push(['Objeto',`${p?.desc||p?.name||'Proyecto'}${dl.length?` Entregables: ${dl.join(', ')}.`:''}`],
   ['Plazos',`Empieza el ${fmtLong(p?.start)} y se entrega el ${fmtLong(p?.end)}. Si el cliente tarda en enviar material o respuestas, la entrega se retrasa los mismos días.`],
   ['Precio y forma de pago',`${eur(p?.budget||0)} más IVA. ${k.deposit?`Un ${k.deposit} % al firmar este contrato y el resto a la entrega`:'A la entrega'}, con un plazo de pago de ${pr.payDays} días.`],
   ['Rondas de cambios',`Incluye ${p?.roundsIncluded??2} rondas de cambios por entregable. Cada ronda extra cuesta ${eur(pr.extraRound)} más IVA.`],
   ['Propiedad intelectual',ipTxt]);
  if(k.portfolio)L.push(['Portfolio','Se podrá mostrar el trabajo terminado en el portfolio y las redes de quien lo creó, salvo que el cliente pida lo contrario por escrito.']);
  L.push(['Cancelación','Si el cliente cancela el proyecto, pagará el trabajo hecho hasta ese momento. El anticipo no se devuelve.'],['Confidencialidad','Ambas partes mantendrán en secreto la información que se compartan.']);
 }
 if(k.extra)L.push(['Otras condiciones',k.extra]);
 return L;
}

function weeks(n=4){const T=today0();const mon=new Date(T);mon.setDate(T.getDate()-((T.getDay()+6)%7));return [...Array(n)].map((_,i)=>{const a=new Date(mon);a.setDate(mon.getDate()+i*7);const b=new Date(a);b.setDate(a.getDate()+6);return{a:iso(a),b:iso(b),i}})}
function loadOf(pid,w){const ts=S.tasks.filter(t=>!t.done&&t.due&&(t.assignee||'')===pid&&((t.due>=w.a&&t.due<=w.b)||(w.i===0&&t.due<w.a)));
 let h=ts.reduce((a,t)=>a+est(t),0);if(!pid)h+=S.retainers.filter(r=>r.active).reduce((a,r)=>a+r.hours,0)/4.3;return{h:Math.round(h*10)/10,ts}}
function workloadView(){
 const W=weeks();const people=[{id:'',name:'Tú',c:null},...S.contacts.filter(c=>c.type==='Colaborador').map(c=>({id:c.id,name:c.name,c}))];
 const need=+ui.wNew||10;
 const free=W.map(w=>({w,f:capOf(null)-loadOf('',w).h}));const first=free.find(x=>x.f>=need);
 const helpers=people.slice(1).filter(p=>p.c.availability!=='ocupado').map(p=>({p,f:capOf(p.c)-loadOf(p.id,W[0]).h})).filter(x=>x.f>=4);
 const sel=ui.wSel&&ui.wSel.split('|');const selL=sel?loadOf(sel[0],W[+sel[1]]):null;
 return `<div class="ph"><div><div class="eyebrow">Trabajo</div><h1>Horas y carga</h1><p>Cuántas horas tienes comprometidas las próximas semanas, tú y tus colaboradores, según las tareas con fecha y sus horas estimadas.</p></div></div>
 ${hTabs()}

  <div class="table-wrap"><table class="wl"><thead><tr><th>Persona</th>${W.map(w=>`<th>Semana del ${fmtShort(w.a)}</th>`).join('')}</tr></thead><tbody>
  ${people.map(p=>{const cap0=capOf(p.c);return `<tr style="cursor:default"><td><div style="display:flex;gap:10px;align-items:center"><span class="avatar ${p.id?avCls(p.id):'peach'}">${p.id?initials(p.name):initials(S.profile.fullName)}</span><div><b>${esc(p.name)}</b><div class="chip">${cap0} h/semana${p.c?` · ${(AVAIL[p.c.availability]||AVAIL.disponible).label.toLowerCase()}`:''}</div></div></div></td>
   ${W.map(w=>{const l=loadOf(p.id,w);const r=cap0?l.h/cap0:(l.h?2:0);const col=r>1?'var(--danger)':r>.8?'var(--peach-strong)':'var(--sage-strong)';return `<td><button class="wl-cell ${ui.wSel===p.id+'|'+w.i?'on':''}" data-act="wl-sel" data-s="${p.id}|${w.i}"><span class="num">${l.h} h <small>de ${cap0}</small></span><span class="track"><i style="width:${Math.min(100,r*100)}%;background:${col}"></i></span></button></td>`}).join('')}</tr>`}).join('')}
  </tbody></table></div>
  ${selL?`<div class="sec-lbl">${esc(sel[0]?C(sel[0]).name:'Tú')} · semana del ${fmtShort(W[+sel[1]].a)}</div><div class="list">${selL.ts.map(t=>`<div class="follow" data-act="edit" data-kind="task" data-id="${t.id}" style="cursor:pointer"><div style="flex:1;min-width:0"><b>${esc(t.title)}</b><div class="chip">${relD(t.due)}${P(t.projectId)?' · '+esc(P(t.projectId).name):''}</div></div><b class="num">${est(t)} h</b></div>`).join('')||'<div class="empty">Sin tareas con fecha esta semana.</div>'}${!sel[0]?`<div class="chip" style="padding:8px 4px">+ ${hrs(S.retainers.filter(r=>r.active).reduce((a,r)=>a+r.hours,0)/4.3*60)} de igualas a la semana</div>`:''}</div>`:'<p class="foot-note">Pulsa una celda para ver sus tareas. Las horas de tus igualas se reparten entre las semanas.</p>'}
 </section>
 <section class="card"><div class="card-h"><h2>${ic('spark')}¿Puedes aceptar un proyecto nuevo?</h2></div>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span>Necesitaría</span><input class="input num" type="number" id="wl-new" value="${need}" style="width:90px" data-change="wl-new" aria-label="Horas por semana"><span>horas a la semana.</span></div>

}

 if(!typing&&!$('#layer').innerHTML&&!e.metaKey&&!e.ctrlKey&&!e.altKey){
  if(e.key==='n'||e.key==='N'){e.preventDefault();openForm('task')}
  if(e.key==='/'){e.preventDefault();openPalette()}
 }
});
/* Arrastrar y soltar: tareas, oportunidades y publicaciones */
document.addEventListener('dragstart',e=>{const d=e.target.closest&&e.target.closest('[data-drag]');if(d){e.dataTransfer.setData('text/plain',d.dataset.drag);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const q=e.target.closest('[data-drop],[data-drop-stage],[data-drop-post]');if(q){e.preventDefault();document.querySelectorAll('.quad,.kcol').forEach(x=>x.classList.toggle('over',x===q))}});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest('[data-drop],[data-drop-stage],[data-drop-post]'))document.querySelectorAll('.quad,.kcol').forEach(x=>x.classList.remove('over'))});
document.addEventListener('drop',e=>{
 const q=e.target.closest('[data-drop],[data-drop-stage],[data-drop-post]');if(!q)return;e.preventDefault();
 const [type,id]=(e.dataTransfer.getData('text/plain')||'').split(':');
 if(type==='t'&&q.dataset.drop){const t=S.tasks.find(x=>x.id===id);if(!t)return;const k=q.dataset.drop;const prev=quadOf(t);t.urgent=k==='q1'||k==='q3';t.important=k==='q1'||k==='q2';save();render();if(prev!==k)toast(`Movida a «${QUADS[k].label}»`)}
 if(type==='d'&&q.dataset.dropStage){const d=DL(id);if(!d||d.stage===q.dataset.dropStage){render();return}setDealStage(d,q.dataset.dropStage);render()}
 if(type==='p'&&q.dataset.dropPost){const p=S.posts.find(x=>x.id===id);if(!p)return;p.status=q.dataset.dropPost;save();render();toast(`Publicación: ${PST2[p.status].label}`)}
});
window.addEventListener('hashchange',()=>{if($('.wizard'))return;closeLayer();$('#content').scrollTop=0;render()});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(S.prefs.theme==='system')renderShell()});
setInterval(()=>{const el=$('#timerTxt');if(el&&S.timer)el.textContent=elapsed()},1000);
applyTheme();render();
if(!S.onboarded)openWizard();
</script>

</body>
</html>
